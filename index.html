<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jacob Anderson · Anderson Health Co</title>
<meta name="description" content="Jacob Anderson, Anderson Health Co. Call, email, save contact.">
<meta name="theme-color" content="#123a35">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE: calm, confident, personal — a trainer you trust with your body
   IDEA: a real printed business card held in the hand, with tappable lines
   PICTURE: Jacob's headshot filling the top of the card
   COLOUR and TYPE: deep spruce ground, near-white card, coral accent; Archivo
   LAYOUT: one centred card, one column, primary action at thumb height */
:root{color-scheme:light dark;
  --bg:light-dark(#123a35,#0a1f1c);--card:light-dark(#fbfaf7,#16302c);
  --ink:light-dark(#10211e,#eef3f1);--mute:light-dark(#5b6b67,#a3b5b0);
  --line:light-dark(#e6e2d9,#24433e);--acc:#e8553d;--acc-ink:#fff;--tint:light-dark(#eef4f2,#1c3a35)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Archivo,system-ui,-apple-system,"Segoe UI",sans-serif;
  display:flex;justify-content:center;padding:max(24px,env(safe-area-inset-top)) 16px 32px;overflow-x:clip}
.card{width:100%;max-width:420px;align-self:flex-start;background:var(--card);border-radius:22px;
  box-shadow:0 1px 0 rgba(255,255,255,.06) inset,0 24px 60px rgba(0,0,0,.35);overflow:hidden;animation:rise .5s ease-out both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
@media(prefers-reduced-motion:reduce){.card{animation:none}}
.head{position:relative;padding:20px 24px 20px;background:var(--tint);border-bottom:1px solid var(--line)}
.photo{display:block;width:100%;height:auto;aspect-ratio:560/602;object-fit:cover;object-position:50% 0%;background:#d9d8da}
h1{margin:0;font-size:clamp(32px,9vw,40px);line-height:1.05;font-weight:800;letter-spacing:-.01em;text-wrap:balance}
.biz{margin:6px 0 0;font-size:17px;font-weight:600;color:var(--mute)}
.list{list-style:none;margin:0;padding:6px 0}
.list a{display:flex;align-items:center;gap:14px;min-height:60px;padding:8px 24px;color:inherit;text-decoration:none}
.list a:hover{background:var(--tint)}
.list a:focus-visible,.btn:focus-visible{outline:3px solid var(--acc);outline-offset:-3px}
.ic{flex:none;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--tint);color:var(--acc)}
.ic svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.t{display:flex;flex-direction:column;line-height:1.25}
.t small{font-size:13px;color:var(--mute)}
.t b{font-size:17px;font-weight:600;overflow-wrap:anywhere}
.list li+li a{border-top:1px solid var(--line)}
.note{margin:4px 24px 0;padding:12px 14px;border-radius:12px;background:var(--tint);font-size:15px;display:flex;gap:10px;align-items:center}
.note svg{flex:none;width:18px;height:18px;fill:none;stroke:var(--acc);stroke-width:2}
.acts{display:grid;gap:10px;padding:20px 24px 24px}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;min-height:54px;border-radius:14px;font:700 17px/1 inherit;
  font-family:inherit;text-decoration:none;border:0;cursor:pointer;width:100%}
.btn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.pri{background:var(--acc);color:var(--acc-ink)}
.pri:active{filter:brightness(.92)}
.sec{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.qr{display:none;padding:0 24px 24px;text-align:center}
.qr.on{display:block}
.qr .box{background:#fff;border-radius:16px;padding:16px;display:inline-block;width:min(100%,260px)}
.qr svg{display:block;width:100%;height:auto}
.qr p{margin:10px 0 0;font-size:14px;color:var(--mute)}
</style>
</head>
